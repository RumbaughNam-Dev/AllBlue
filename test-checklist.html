<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AllBlue 테스트 체크리스트</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a1929; color: #e0e0e0; padding: 20px; max-width: 900px; margin: 0 auto; }
  h1 { color: #fff; margin-bottom: 8px; font-size: 24px; }
  .subtitle { color: #90caf9; margin-bottom: 24px; font-size: 14px; }
  .progress-bar { background: #1a2a3a; border-radius: 8px; height: 24px; margin-bottom: 24px; overflow: hidden; position: relative; }
  .progress-fill { background: linear-gradient(90deg, #035491, #34c759); height: 100%; transition: width 0.3s; border-radius: 8px; }
  .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12px; font-weight: bold; color: #fff; }
  .section { margin-bottom: 24px; border: 1px solid #1a3a5a; border-radius: 12px; overflow: hidden; }
  .section-header { background: #0d2137; padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
  .section-header:hover { background: #112a44; }
  .section-title { font-weight: bold; font-size: 16px; color: #90caf9; }
  .section-title.critical { color: #ffb74d; }
  .section-count { font-size: 13px; color: #607d8b; }
  .section-body { padding: 0; display: none; }
  .section.open .section-body { display: block; }
  .section.open .section-header .arrow { transform: rotate(90deg); }
  .arrow { color: #607d8b; transition: transform 0.2s; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #0a1929; text-align: left; padding: 10px 18px; font-size: 12px; color: #607d8b; border-bottom: 1px solid #1a3a5a; }
  td { padding: 10px 18px; border-bottom: 1px solid #0d2137; font-size: 14px; vertical-align: top; }
  tr:hover { background: #0d2137; }
  tr.checked td { opacity: 0.45; text-decoration: line-through; }
  tr.warn td:nth-child(2) { color: #ffb74d; }
  input[type="checkbox"] { width: 18px; height: 18px; accent-color: #34c759; cursor: pointer; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 4px; }
  .tag-warn { background: rgba(255,183,77,0.15); color: #ffb74d; }
  .tag-critical { background: rgba(244,67,54,0.15); color: #ef5350; }
  .tag-push { background: rgba(3,84,145,0.15); color: #42a5f5; }
  .result-btns { display: flex; gap: 4px; }
  .result-btn { padding: 3px 10px; border-radius: 4px; border: none; font-size: 11px; cursor: pointer; font-weight: bold; }
  .btn-pass { background: rgba(52,199,89,0.15); color: #34c759; }
  .btn-pass.active { background: #34c759; color: #fff; }
  .btn-fail { background: rgba(244,67,54,0.15); color: #ef5350; }
  .btn-fail.active { background: #ef5350; color: #fff; }
  .btn-skip { background: rgba(255,255,255,0.08); color: #607d8b; }
  .btn-skip.active { background: #607d8b; color: #fff; }
  .stats { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat { background: #0d2137; padding: 12px 20px; border-radius: 8px; text-align: center; min-width: 100px; }
  .stat-num { font-size: 24px; font-weight: bold; }
  .stat-label { font-size: 11px; color: #607d8b; margin-top: 4px; }
  .stat-pass .stat-num { color: #34c759; }
  .stat-fail .stat-num { color: #ef5350; }
  .stat-skip .stat-num { color: #607d8b; }
  .stat-total .stat-num { color: #90caf9; }
  .reset-btn { background: rgba(244,67,54,0.15); color: #ef5350; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; margin-bottom: 16px; }
  .reset-btn:hover { background: rgba(244,67,54,0.25); }
</style>
</head>
<body>

<h1>AllBlue 테스트 체크리스트</h1>
<p class="subtitle">v1.0 출시 테스트 - 총 <span id="totalCount">0</span>개 항목</p>

<div class="stats">
  <div class="stat stat-total"><div class="stat-num" id="statTotal">0</div><div class="stat-label">전체</div></div>
  <div class="stat stat-pass"><div class="stat-num" id="statPass">0</div><div class="stat-label">통과</div></div>
  <div class="stat stat-fail"><div class="stat-num" id="statFail">0</div><div class="stat-label">실패</div></div>
  <div class="stat stat-skip"><div class="stat-num" id="statSkip">0</div><div class="stat-label">건너뜀</div></div>
</div>

<div class="progress-bar">
  <div class="progress-fill" id="progressFill" style="width:0%"></div>
  <div class="progress-text" id="progressText">0%</div>
</div>

<button class="reset-btn" onclick="resetAll()">전체 초기화</button>

<div id="sections"></div>

      { id: "11-5", desc: "자격증 등록 요청 시 admin에게 푸시", expected: "자격증 등록 푸시 수신", tag: "push" },
      { id: "11-6", desc: "자격증 승인 후 강사 승격 시 schedulePublic 자동 변경", expected: "수동 변경 안 했으면 Y로" },
    ]
  },
  {
    title: "12. 친구 관리",
    items: [
      { id: "12-1", desc: "친한친구 등록 (검색 > 추가)", expected: "친한친구 탭에 표시" },
      { id: "12-2", desc: "친한친구 삭제", expected: "목록에서 제거" },
      { id: "12-3", desc: "사용자 차단", expected: "친한친구에서도 자동 제거" },
      { id: "12-4", desc: "차단 사용자 관리 > 차단 해제", expected: "차단 해제" },
      { id: "12-5", desc: "강사만 교육생 탭 표시", expected: "level=5인 경우만 탭 보임" },
      { id: "12-6", desc: "[권한] 일반 사용자에게 교육생 탭", expected: "미표시", tag: "warn" },
    ]
  },
  {
    title: "13. 일정 설정 / 문의하기",
    items: [
      { id: "13-1", desc: "일정 공개여부 토글 변경", expected: "설정 저장, 새 일정 기본값 반영" },
      { id: "13-2", desc: "사이드 메뉴에서 일정 설정 진입", expected: "정상 이동" },
      { id: "13-3", desc: "문의 작성 (제목, 내용, 첨부파일)", expected: "등록 완료" },
      { id: "13-4", desc: "문의 목록 조회", expected: "내 문의만 표시" },
      { id: "13-5", desc: "문의 상세 > 답변 확인", expected: "답변 내용 표시" },
    ]
  },
  {
    title: "14. 푸시 알림 통합",
    items: [
      { id: "14-1", desc: "일정 생성 시 참가자에게 푸시", expected: "다이빙 등록 푸시 수신", tag: "push" },
      { id: "14-2", desc: "문의 등록 시 admin에게 푸시", expected: "문의 등록 푸시 수신", tag: "push" },
      { id: "14-3", desc: "자격증 등록 요청 시 admin에게 푸시", expected: "자격증 등록 푸시 수신", tag: "push" },
      { id: "14-4", desc: "단체 등록요청 시 admin에게 푸시", expected: "단체등록요청 푸시 수신", tag: "push" },
      { id: "14-5", desc: "단체 승인 시 대표자에게 푸시", expected: "단체등록 승인 푸시", tag: "push" },
      { id: "14-6", desc: "단체 반려 시 대표자에게 푸시", expected: "단체등록 반려 푸시", tag: "push" },
      { id: "14-7", desc: "소속 등록요청 시 대표자에게 푸시", expected: "단체 등록요청 푸시", tag: "push" },
      { id: "14-8", desc: "소속 승인 시 요청자에게 푸시", expected: "소속 등록 승인 푸시", tag: "push" },
      { id: "14-9", desc: "소속 반려 시 요청자에게 푸시", expected: "소속 등록 반려 푸시", tag: "push" },
    ]
  },
];

const STATE_KEY = 'allblue_test_v1';

function loadState() {
  try { return JSON.parse(localStorage.getItem(STATE_KEY) || '{}'); } catch { return {}; }
}
function saveState(state) {
  localStorage.setItem(STATE_KEY, JSON.stringify(state));
}

function getTagHtml(tag) {
  if (tag === 'warn') return '<span class="tag tag-warn">권한 체크</span>';
  if (tag === 'critical') return '<span class="tag tag-critical">필수 권한</span>';
  if (tag === 'push') return '<span class="tag tag-push">푸시</span>';
  return '';
}

function render() {
  const state = loadState();
  const container = document.getElementById('sections');
  let html = '';
  let total = 0, pass = 0, fail = 0, skip = 0;

  DATA.forEach((section, si) => {
    const sectionOpen = state[`section_${si}_open`] !== false;
    html += `<div class="section ${sectionOpen ? 'open' : ''}" data-si="${si}">`;
    html += `<div class="section-header" onclick="toggleSection(${si})">`;
    html += `<span class="section-title ${section.critical ? 'critical' : ''}">${section.title}${section.critical ? ' &#9733;' : ''}</span>`;

    let sPass = 0, sTotal = section.items.length;
    section.items.forEach(item => { if (state[item.id] === 'pass') sPass++; });
    html += `<span class="section-count">${sPass}/${sTotal} <span class="arrow">&#9654;</span></span>`;
    html += `</div><div class="section-body"><table><thead><tr><th style="width:40px">#</th><th>시나리오</th><th>예상 결과</th><th style="width:140px">결과</th></tr></thead><tbody>`;

    section.items.forEach(item => {
      total++;
      const result = state[item.id] || '';
      if (result === 'pass') pass++;
      else if (result === 'fail') fail++;
      else if (result === 'skip') skip++;
      const rowClass = result === 'pass' ? 'checked' : (item.tag === 'warn' || item.tag === 'critical' ? 'warn' : '');

      html += `<tr class="${rowClass}">`;
      html += `<td>${item.id}</td>`;
      html += `<td>${getTagHtml(item.tag)}${item.desc}</td>`;
      html += `<td>${item.expected}</td>`;
      html += `<td><div class="result-btns">`;
      html += `<button class="result-btn btn-pass ${result === 'pass' ? 'active' : ''}" onclick="setResult('${item.id}','pass')">Pass</button>`;
      html += `<button class="result-btn btn-fail ${result === 'fail' ? 'active' : ''}" onclick="setResult('${item.id}','fail')">Fail</button>`;
      html += `<button class="result-btn btn-skip ${result === 'skip' ? 'active' : ''}" onclick="setResult('${item.id}','skip')">Skip</button>`;
      html += `</div></td></tr>`;
    });

    html += `</tbody></table></div></div>`;
  });

  container.innerHTML = html;

  document.getElementById('totalCount').textContent = total;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPass').textContent = pass;
  document.getElementById('statFail').textContent = fail;
  document.getElementById('statSkip').textContent = skip;

  const done = pass + fail + skip;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '%';
}

function setResult(id, result) {
  const state = loadState();
  if (state[id] === result) delete state[id];
  else state[id] = result;
  saveState(state);
  render();
}

function toggleSection(si) {
  const state = loadState();
  const key = `section_${si}_open`;
  state[key] = state[key] === false ? true : false;
  saveState(state);
  render();
}

function resetAll() {
  if (confirm('모든 테스트 결과를 초기화하시겠습니까?')) {
    localStorage.removeItem(STATE_KEY);
    render();
  }
}

render();
</script>
