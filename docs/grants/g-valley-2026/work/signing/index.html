<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AllBlue 신청서 서명</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#15263b;font:16px/1.65 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}main{max-width:1020px;margin:35px auto;padding:0 24px 60px}h1{font-size:30px;margin:0 0 8px}h2{font-size:20px;margin:0 0 14px}.muted{color:#57677d}.card{padding:26px;background:white;border:1px solid #dce4ee;border-radius:18px;margin:20px 0}a{color:#08649f}button,.link{border:1px solid #b8c9dd;background:white;border-radius:9px;padding:10px 17px;color:#183552;font:inherit;cursor:pointer}button:hover{background:#eaf2fa}button.primary{background:#08649f;color:white;border-color:#08649f;font-weight:700}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}canvas{display:block;width:100%;height:auto;aspect-ratio:900/280;border:2px dashed #a6b8ce;border-radius:12px;touch-action:none;cursor:crosshair;background:linear-gradient(transparent 74%,#edf1f7 74%,#edf1f7 74.5%,transparent 74.5%)}label{display:flex;gap:12px;align-items:flex-start;margin:15px 0}input{width:20px;height:20px;margin-top:4px;flex-shrink:0}.preview{width:100%;max-height:650px;object-fit:contain;background:#eef2f6;margin-top:18px;border:1px solid #dde4ed}#status{white-space:pre-line;margin-top:16px;font-weight:600}details{margin-bottom:20px}summary{cursor:pointer;font-weight:600}.pill{font-size:13px;letter-spacing:.04em;color:#28799b;font-weight:700}#hint{pointer-events:none;color:#8998ab;text-align:center;margin-top:-170px;height:170px;padding-top:20px}#result{display:none;margin-top:15px}</style>
<main><div class="pill">ALLBLUE · G밸리 창업경진대회</div><h1>신청서에 서명하기</h1><p class="muted">아래 칸에 마우스를 누른 채 서명을 그려 주세요. 완성한 서명을 신청서 1·8·9쪽에 넣습니다.</p>
<section class="card"><h2>1. 서명할 내용 확인</h2><div class="row"><button type="button" onclick="showPage(1)">1쪽 지원신청서</button><button type="button" onclick="showPage(8)">8쪽 개인정보 동의서</button><button type="button" onclick="showPage(9)">9쪽 대표자 서약서</button><a href="/source.pdf?key=__TOKEN__" target="_blank" rel="noopener">전체 9쪽 PDF 보기 ↗</a></div><img class="preview" id="preview" src="/page1.png?key=__TOKEN__" alt="지원신청서 1쪽"><p class="muted">서명 대상: 럼바우 · 남상현. 원본 HWP의 항목과 동의·서약 문구를 옮겨 만든 서명용 PDF입니다.</p></section>
<section class="card"><h2>2. 마우스로 서명</h2><canvas id="pad" width="900" height="280" aria-label="마우스로 서명을 그리는 영역"></canvas><div id="hint">여기에 서명해 주세요</div><div class="row" style="margin-top:16px"><button id="undo" type="button">마지막 획 지우기</button><button id="clear" type="button">모두 지우기</button></div></section>
<section class="card"><h2>3. 동의 확인 후 저장</h2><label><input type="checkbox" id="consent"><span>8쪽의 개인정보 수집·이용 내용에 동의합니다. <span class="muted">참가신청·본인확인·심사·사후관리 목적, 보유기간 5년.</span></span></label><label><input type="checkbox" id="thirdParty"><span>8쪽에 명시된 기관에 개인정보를 제3자 제공하는 데 동의합니다. <span class="muted">상금·상장·입주바우처 전달 목적, 목적 달성 후 폐기.</span></span></label><label><input type="checkbox" id="apply"><span>1쪽 신청 내용과 9쪽 대표자 서약을 확인했으며, 제가 그린 서명을 <strong>1·8·9쪽 세 곳에 적용</strong>합니다.</span></label><button class="primary" id="save">서명 넣고 PDF 저장</button><p class="muted">이 컴퓨터에 서명본을 저장합니다. 저장 후 제출 전에 서명 위치를 확인합니다.</p><div id="status" role="status" aria-live="polite"></div><div id="result"><a class="link" id="signed" target="_blank" rel="noopener">완성된 서명본 열기 ↗</a></div></section></main>
<script>
const key='__TOKEN__',pad=document.getElementById('pad'),ctx=pad.getContext('2d');let strokes=[],active=null,dirty=false;
function showPage(n){document.getElementById('preview').src='/page'+n+'.png?key='+key;document.getElementById('preview').alt=n+'쪽 서명할 문서';}
function redraw(){ctx.clearRect(0,0,900,280);ctx.strokeStyle='#0b1933';ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';for(const s of strokes){ctx.beginPath();s.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();}document.getElementById('hint').style.visibility=strokes.length?'hidden':'visible';}
function point(e){const r=pad.getBoundingClientRect();return[Math.max(0,Math.min(900,(e.clientX-r.left)*900/r.width)),Math.max(0,Math.min(280,(e.clientY-r.top)*280/r.height))];}
pad.onpointerdown=e=>{if(e.button!==0||active!==null)return;e.preventDefault();pad.setPointerCapture(e.pointerId);active=e.pointerId;strokes.push([point(e)]);dirty=true;redraw();};
pad.onpointermove=e=>{if(active!==e.pointerId)return;for(const p of (e.getCoalescedEvents?.()||[e]))strokes[strokes.length-1].push(point(p));redraw();};
function end(e){if(active!==e.pointerId)return;strokes[strokes.length-1].push(point(e));active=null;redraw();}pad.onpointerup=end;pad.onpointercancel=()=>{active=null;};
document.getElementById('undo').onclick=()=>{strokes.pop();dirty=true;redraw();};document.getElementById('clear').onclick=()=>{strokes=[];dirty=false;redraw();};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
document.getElementById('save').onclick=async()=>{const status=document.getElementById('status'),button=document.getElementById('save');const data={strokes};for(const k of ['consent','thirdParty','apply'])data[k]=document.getElementById(k).checked;if(!strokes.some(s=>s.length>3)){status.textContent='서명을 먼저 그려 주세요.';return;}if(!data.consent||!data.thirdParty||!data.apply){status.textContent='위 내용을 확인하고 세 항목을 선택해 주세요.';return;}button.disabled=true;status.textContent='서명을 넣고 PDF를 저장하고 있습니다…';try{const r=await fetch('/save?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();if(!r.ok)throw Error(result.error||'저장하지 못했습니다.');dirty=false;status.textContent=result.message;document.getElementById('signed').href=result.url;document.getElementById('result').style.display='block';}catch(e){status.textContent=e.message;}finally{button.disabled=false;}};
</script></html>
